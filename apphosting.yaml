# Firebase App Hosting configuration for the INFIDEC admin.
# Public values only. Credentials come from Cloud Secret Manager (see README → Deploying).
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # Firebase web config (public identifiers, needed at build time for NEXT_PUBLIC_*)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBU2miCs6fmFiOYwgd1eD4mw2WCavvVXj4"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "infidec-admin.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "infidec-admin"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "infidec-admin.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "231459121142"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:231459121142:web:6345bbd143aacb446849d7"
    availability:
      - BUILD
      - RUNTIME
  - variable: APP_PUBLIC_HOSTS
    value: "infidec-admin.web.app,infidec-admin.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  # Firebase Admin SDK — the private key is a secret; project and client email are not
  - variable: FIREBASE_PROJECT_ID
    value: "infidec-admin"
    availability:
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    value: "firebase-adminsdk-fbsvc@infidec-admin.iam.gserviceaccount.com"
    availability:
      - RUNTIME
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: "infidec-admin.firebasestorage.app"
    availability:
      - RUNTIME
  - variable: SESSION_COOKIE_DAYS
    value: "5"
    availability:
      - RUNTIME

  # AES-256-GCM key for integration secrets stored in Firestore (must match the key used to save them)
  - variable: INTEGRATION_ENCRYPTION_KEY
    secret: INTEGRATION_ENCRYPTION_KEY
    availability:
      - RUNTIME

  # SMTP (Gmail)
  - variable: MAIL_HOST
    value: "smtp.gmail.com"
    availability:
      - RUNTIME
  - variable: MAIL_PORT
    value: "587"
    availability:
      - RUNTIME
  - variable: MAIL_SCHEME
    value: "smtp"
    availability:
      - RUNTIME
  - variable: MAIL_USERNAME
    value: "hrsanghani2971@gmail.com"
    availability:
      - RUNTIME
  - variable: MAIL_FROM_ADDRESS
    value: "hrsanghani2971@gmail.com"
    availability:
      - RUNTIME
  - variable: MAIL_PASSWORD
    secret: MAIL_PASSWORD
    availability:
      - RUNTIME
